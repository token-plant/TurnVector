name: Contribution policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  contribution-policy:
    name: Contribution policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pull request commits as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/policy/pr-head"

      - name: Validate contribution policy
        env: {EVENT_BASE_SHA: "${{ github.event.pull_request.base.sha }}", EVENT_HEAD_SHA: "${{ github.event.pull_request.head.sha }}"}
        run: |
          set -eu; helper="$(mktemp "${RUNNER_TEMP}/turnvector-policy.XXXXXX")"; trap 'rm -f "$helper"' EXIT
          base="$(env -i PATH="$PATH" LC_ALL=C GIT_NO_REPLACE_OBJECTS=1 git rev-parse --verify HEAD^{commit})"; head="$(env -i PATH="$PATH" LC_ALL=C GIT_NO_REPLACE_OBJECTS=1 git rev-parse --verify refs/remotes/policy/pr-head^{commit})"
          test "$base" = "$EVENT_BASE_SHA"; test "$head" = "$EVENT_HEAD_SHA"
          entry="$(env -i PATH="$PATH" LC_ALL=C GIT_NO_REPLACE_OBJECTS=1 git ls-tree "$base" -- scripts/check_commit_policy.py)"
          test "${entry%% *}" = 100755; entry="${entry#* }"; test "${entry%% *}" = blob
          env -i PATH="$PATH" LC_ALL=C GIT_NO_REPLACE_OBJECTS=1 git cat-file blob "${base}:scripts/check_commit_policy.py" >"$helper"; test -s "$helper"
          env -i PATH="$PATH" LC_ALL=C python3 -I -B "$helper" --event "$GITHUB_EVENT_PATH" --base "$base" --head "$head"
